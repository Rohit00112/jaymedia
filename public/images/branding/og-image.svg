    <rect width="70" height="70" rx="4" fill="#1B1B21" stroke="#33333F" stroke-width="2" />
    <path d="M24 19 H42 V39 C42 47 36 51 28 51 C23 51 17 48 15 44 L22 38 C23 41 25 43 28 43 C31 43 34 41 34 38 V27 H24 V19 Z" fill="#F5F2EC" />
    <circle cx="49" cy="24" r="5" fill="#FF594F" />

    <!-- Brand Category -->
    <text x="95" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="2" fill="#FFFFFF">
