<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="coralGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF594F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#101014" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep ink background -->
  <rect width="1200" height="630" fill="#101014" />
  
  <!-- Subtle glowing atmosphere -->
  <rect width="1200" height="630" fill="url(#coralGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 140)">
