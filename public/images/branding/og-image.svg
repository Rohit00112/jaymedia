    </text>
  </g>

  <!-- Bottom Coordinates -->
  <text x="100" y="580" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="3" fill="#666675">
    LOCATION: NEAR TRAFFIC CHOWK, MAIN ROAD, BIRATNAGAR • WWW.JAYMEDIAMANAGEMENT.COM
  </text>
